<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">homebrew-tap install flow</title>
  <desc id="desc">Homebrew tap, formula index, and installed macOS tools flow.</desc>
  <rect width="900" height="600" rx="28" fill="#f4f1ec"/>
  <g fill="none" stroke="#ded6c7" stroke-width="1">
    <path d="M84 110h732M84 492h732"/>
    <path d="M150 170h600M150 430h600" opacity=".55"/>
  </g>
  <text x="80" y="78" fill="#182536" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700">homebrew-tap</text>
  <text x="80" y="114" fill="#596170" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Install personal macOS tools with Homebrew</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4" fill="none" stroke="#6f91c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#796d5c" flood-opacity=".16"/>
    </filter>
  </defs>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#shadow)">
    <g transform="translate(82 202)">
      <rect width="202" height="128" rx="18" fill="#fffdfa" stroke="#e7dfd1"/>
      <text x="101" y="50" text-anchor="middle" fill="#192638" font-size="18" font-weight="700">brew tap</text>
      <text x="101" y="79" text-anchor="middle" fill="#66717e" font-size="15">scasella/tools</text>
    </g>
    <g transform="translate(349 178)">
      <rect width="202" height="176" rx="18" fill="#ffffff" stroke="#d9e1ef"/>
      <text x="101" y="44" text-anchor="middle" fill="#192638" font-size="18" font-weight="700">formula index</text>
      <rect x="42" y="72" width="118" height="18" rx="9" fill="#eef4fb"/>
      <rect x="42" y="102" width="92" height="18" rx="9" fill="#eef4fb"/>
      <rect x="42" y="132" width="130" height="18" rx="9" fill="#eef4fb"/>
    </g>
    <g transform="translate(616 202)">
      <rect width="202" height="128" rx="18" fill="#fffdfa" stroke="#e7dfd1"/>
      <text x="101" y="50" text-anchor="middle" fill="#192638" font-size="18" font-weight="700">install tools</text>
      <text x="101" y="79" text-anchor="middle" fill="#66717e" font-size="15">menu bar apps</text>
    </g>
  </g>
  <g stroke="#6f91c8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M284 266h52"/>
    <path d="M551 266h52"/>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="258" y="402" width="384" height="58" rx="29" fill="#edf5ef" stroke="#c9e1cf"/>
    <text x="450" y="437" text-anchor="middle" fill="#2f7c5c" font-size="17" font-weight="700">repeatable installs for small macOS utilities</text>
  </g>
</svg>
